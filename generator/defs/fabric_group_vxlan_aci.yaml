# Source: tf-nd-learnings/nd_api_spec/manage_1.2.224.json
# Model: fabricGroupTypeVxlanAci; create/update body: baseFabric -> fabricGroup.
# Shared CRUD uses /api/v1/manage/fabrics and /fabrics/{fabricName}; there is
# no separate generated REST endpoint for this inherited fabric resource.
# POST/PUT may return 202 and need canonical GET readback. DELETE has no body.
# clusterName is operation routing, not a persisted fabric-group attribute.
# Membership actions, list pagination/filtering, and summary-only metadata are
# intentionally outside this settings resource.
#
# Handwritten integration still required:
# - Inject category=fabricGroup and management.type=vxlanAci before serialization.
# - Keep securityGroupTag on the shared BoolOrString wire type while exposing
#   the Fabric Group value as a validated Terraform string.
# - Preserve API-omitted BGP keys and suppress sensitive payload logging.
# - Validate VNI/SGT range bounds, ordering, and documented compatibility rules.
# - Handle version-dependent route-server settings and backup/authentication
#   conditions using confirmed API behavior rather than inferred requiredness.
# Native min/max/length and write_only fields are parsed by the local generator,
# but explicit validators and handwritten secret handling are still necessary.
resource:
  name: fabric_group_vxlan_aci
  generate_tf_resource: true
  skip_equality: true
  parent_package: resource_fabric_common
  parent_model: fabric_common
  category: manage
  doc_category: Fabrics
  # minimum_version: 4.2.1
  description: |
    Manages the configuration of a VXLAN-ACI fabric group in Nexus Dashboard.

    Fabric-group membership is managed separately. Remove member fabrics before
    deleting the group. Add the ACI fabric before the NX-OS fabrics and remove it
    last. Detach and deploy Nexus Dashboard-owned policies before removing the ACI
    fabric. VXLAN-ACI fabric groups are limited to one Nexus Dashboard cluster;
    the ACI fabric requires border gateways, telemetry enabled during onboarding,
    and Orchestration disabled. The group type is fixed to VXLAN-ACI.

    Import uses the fabric-group name. Create and update can complete asynchronously.
  import_id:
    - my_fabric_group
  import_desc:
    - fabric_name
  attributes:
    - model_name: id
      tf_name: id
      description: The Terraform identifier of the fabric group, derived from its name.
      type: String
      computed: true
      payload_hide: true

    - model_name: name
      tf_name: fabric_name
      description: The name of the VXLAN-ACI fabric group. Changing the name replaces the resource.
      type: String
      mandatory: true
      tf_requires_replace: true
      example: tf-fabric-group-vxlan-aci

    # Hidden defaults document fixed values; tf_hide prevents schema defaults
    # from initializing these fields. Handwritten PreMarshal must inject both.
    - model_name: category
      tf_name: category
      description: The fixed API category for the fabric group.
      type: String
      default_value: fabricGroup
      tf_hide: true

    - model_name: type
      tf_name: fabric_type
      description: The fixed VXLAN-ACI fabric-group type.
      type: String
      default_value: vxlanAci
      tf_hide: true
      ndfc_nested:
        - management

    - model_name: l2VniRange
      tf_name: l2_vni_range
      description: >-
        The overlay network identifier range. Identifiers must be between 1 and
        16777214. Defaults to `30000-49000` when not specified in the configuration.
      type: String
      default_value: '30000-49000'
      ndfc_nested:
        - management
      example: '30000-49000'
      # The schema defines no range-string pattern. Bounds and ordering need
      # handwritten validation; a syntax-only regex would not enforce them.

    - model_name: l3VniRange
      tf_name: l3_vni_range
      description: >-
        The overlay VRF identifier range. Identifiers must be between 1 and
        16777214. Defaults to `50000-59000` when not specified in the configuration.
      type: String
      default_value: '50000-59000'
      ndfc_nested:
        - management
      example: '50000-59000'
      # Bounds and ordering require handwritten range validation.

    - model_name: anycastGatewayMac
      tf_name: anycast_gateway_mac
      description: >-
        The shared anycast gateway MAC address for all VTEPs, in `xxxx.xxxx.xxxx`
        format. It must match the APIC bridge-domain MAC and the NX-OS member fabrics.
      type: String
      mandatory: true
      validator: 'RegexMatches(regexp.MustCompile(`^[0-9A-Fa-f]{4}(\.[0-9A-Fa-f]{4}){2}$`), "must be a MAC address in xxxx.xxxx.xxxx format")'
      ndfc_nested:
        - management
      example: 0022.bdf8.19ff
      # Prior user-confirmed API behavior rejects an omitted value. OpenAPI
      # instead marks it optional with default 0022.bdf8.19ff; retain this exception.

    - model_name: multisiteOverlayInterConnectType
      tf_name: multisite_overlay_inter_connect_type
      description: >-
        The multi-site overlay interconnect method. Allowed values are `manual`,
        `routeServer`, or `directPeering`. The `routeServer` option for VXLAN-ACI
        requires Nexus Dashboard 4.3.1 or later. Defaults to `directPeering` when
        not specified in the configuration.
      type: String
      default_value: directPeering
      validator: 'OneOf("manual", "routeServer", "directPeering")'
      ndfc_nested:
        - management
      example: directPeering

    - model_name: routeServerCollection
      tf_name: route_server_collection
      description: The multi-site route servers used with the `routeServer` interconnect method on supported Nexus Dashboard versions.
      type: List
      optional: true
      ndfc_nested:
        - management
      attributes:
        - model_name: routeServerIp
          tf_name: route_server_ip
          description: The IPv4 or IPv6 address of the route server.
          type: String
          optional: true
          validator: 'RegexMatches(regexp.MustCompile(`^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$|^\s*((([0-9A-Fa-f]{1,4}:){7}([0-9A-Fa-f]{1,4}|:))|(([0-9A-Fa-f]{1,4}:){6}(:[0-9A-Fa-f]{1,4}|((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3})|:))|(([0-9A-Fa-f]{1,4}:){5}(((:[0-9A-Fa-f]{1,4}){1,2})|:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3})|:))|(([0-9A-Fa-f]{1,4}:){4}(((:[0-9A-Fa-f]{1,4}){1,3})|((:[0-9A-Fa-f]{1,4})?:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9A-Fa-f]{1,4}:){3}(((:[0-9A-Fa-f]{1,4}){1,4})|((:[0-9A-Fa-f]{1,4}){0,2}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9A-Fa-f]{1,4}:){2}(((:[0-9A-Fa-f]{1,4}){1,5})|((:[0-9A-Fa-f]{1,4}){0,3}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9A-Fa-f]{1,4}:){1}(((:[0-9A-Fa-f]{1,4}){1,6})|((:[0-9A-Fa-f]{1,4}){0,4}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(:(((:[0-9A-Fa-f]{1,4}){1,7})|((:[0-9A-Fa-f]{1,4}){0,5}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:)))(%.+)?\s*$`), "must match the OpenAPI IPv4 or IPv6 address pattern")'

        - model_name: routeServerAsn
          tf_name: route_server_asn
          description: >-
            The route-server autonomous system number. Use an integer from 1 to
            4294967295 or dotted notation with a first component from 1 to 65535
            and a second component from 0 to 65535, matching the OpenAPI ASN pattern.
          type: String
          optional: true
          validator: 'RegexMatches(regexp.MustCompile(`^(([1-9]{1}[0-9]{0,8}|[1-3]{1}[0-9]{1,9}|[4]{1}([0-1]{1}[0-9]{8}|[2]{1}([0-8]{1}[0-9]{7}|[9]{1}([0-3]{1}[0-9]{6}|[4]{1}([0-8]{1}[0-9]{5}|[9]{1}([0-5]{1}[0-9]{4}|[6]{1}([0-6]{1}[0-9]{3}|[7]{1}([0-1]{1}[0-9]{2}|[2]{1}([0-8]{1}[0-9]{1}|[9]{1}[0-5]{1})))))))))|([1-5]\d{4}|[1-9]\d{0,3}|6[0-4]\d{3}|65[0-4]\d{2}|655[0-2]\d|6553[0-5])(\.([1-5]\d{4}|[1-9]\d{0,3}|6[0-4]\d{3}|65[0-4]\d{2}|655[0-2]\d|6553[0-5]|0))?)$`), "must match the OpenAPI autonomous system number pattern")'
      # Examples are omitted here so the default directPeering example does not
      # also configure route servers. Neither child is globally required by the spec.

    - model_name: routeServerRedistributeDirectRouteMap
      tf_name: route_server_redistribute_direct_route_map
      description: >-
        Enables automatic creation of multi-site overlay inter-fabric links on
        route servers. This setting applies only when the deployment method is
        `routeServer`. Defaults to `false` when not specified in the configuration.
      type: Bool
      ndfc_type: bool
      default_value: false
      ndfc_nested:
        - management
      # The API model description says centralizedToRouteServers, but the 4.3.1
      # User Content applies this field to routeServer. Enforce that condition
      # in handwritten validation; do not add centralizedToRouteServers as an enum value.

    - model_name: routeServerRoutingTag
      tf_name: route_server_routing_tag
      description: >-
        The routing tag associated with the route-server IP for redistribute-direct
        eBGP EVPN peering. Valid values are 0 through 4294967295. Defaults to
        `54321` when not specified in the configuration.
      type: Int64
      default_value: 54321
      validator: 'Between(0, 4294967295)'
      ndfc_nested:
        - management

    - model_name: enableMsOverlayIfcBgpDesc
      tf_name: enable_ms_overlay_ifc_bgp_desc
      description: >-
        Generates BGP neighbor descriptions for automatically created multi-site
        overlay inter-fabric links. Defaults to `true` when not specified in the configuration.
      type: Bool
      ndfc_type: bool
      default_value: true
      ndfc_nested:
        - management

    - model_name: autoMultisiteUnderlayInterConnect
      tf_name: auto_multisite_underlay_inter_connect
      description: >-
        Controls automatic multi-site underlay interconnect configuration. Defaults
        to `false` when not specified in the configuration.
      type: Bool
      ndfc_type: bool
      default_value: false
      ndfc_nested:
        - management
      # Prior user-confirmed API response default: false. OpenAPI declares true.
      # This observation was not repeated against a live API in this change.

    - model_name: multisiteDelayRestore
      tf_name: multisite_delay_restore
      description: >-
        The multi-site underlay and overlay control-plane convergence delay in
        seconds. Valid values are 30 through 1000. Defaults to `300` when not
        specified in the configuration.
      type: Int64
      default_value: 300
      validator: 'Between(30, 1000)'
      ndfc_nested:
        - management

    - model_name: multisiteInterConnectBgpAuthentication
      tf_name: multisite_inter_connect_bgp_authentication
      description: >-
        Enables BGP authentication for the multi-site interconnect. Defaults to
        `false` when not specified in the configuration.
      type: Bool
      ndfc_type: bool
      default_value: false
      ndfc_nested:
        - management

    - model_name: multisiteInterConnectBgpAuthKeyType
      tf_name: multisite_inter_connect_bgp_auth_key_type
      description: >-
        The BGP authentication key encryption type. Allowed values are `3des`,
        `type6`, or `type7`. Defaults to `3des` when not specified in the configuration.
      type: String
      default_value: '3des'
      validator: 'OneOf("3des", "type6", "type7")'
      ndfc_nested:
        - management

    - model_name: multisiteInterConnectBgpKey
      tf_name: multisite_inter_connect_bgp_key
      description: >-
        The encrypted BGP authentication key. It must contain 1 through 256
        characters without whitespace. This is sensitive authentication material;
        preserve the configured value when the API omits it from readback.
      type: String
      optional: true
      sensitive: true
      write_only: true
      validator: 'LengthBetween(1, 256), stringvalidator.RegexMatches(regexp.MustCompile(`^\S+$`), "must not contain whitespace")'
      ndfc_nested:
        - management
      # write_only is metadata in the inspected generator. Handwritten code must
      # preserve API-omitted values. Do not emit a secret-bearing example.

    - model_name: multisiteLoopbackId
      tf_name: multisite_loopback_id
      description: >-
        The multi-site loopback identifier for NX fabrics. Valid values are 0 through
        1023. Defaults to `100` when not specified in the configuration.
      type: Int64
      default_value: 100
      validator: 'Between(0, 1023)'
      ndfc_nested:
        - management

    - model_name: borderGatewayRoutingTag
      tf_name: border_gateway_routing_tag
      description: >-
        The routing tag associated with loopback and DCI interface IP addresses for
        NX fabrics. Valid values are 0 through 4294967295. Defaults to `54321`
        when not specified in the configuration.
      type: Int64
      default_value: 54321
      validator: 'Between(0, 4294967295)'
      ndfc_nested:
        - management

    - model_name: securityGroupTag
      tf_name: security_group_tag
      description: >-
        The security-group mode. Allowed values are `loose` or `strict`. In `strict`
        mode, only child fabrics with security groups enabled are allowed. Defaults
        to `strict` when not specified in the configuration.
      type: String
      ndfc_type: bool_or_string
      default_value: strict
      validator: 'OneOf("loose", "strict")'
      ndfc_nested:
        - management
      # Fabric Groups expose a string enum; ordinary fabrics expose a Bool over the shared wire type.

    - model_name: securityGroupTagPrefix
      tf_name: security_group_tag_prefix
      description: >-
        The prefix used for newly created security groups. It must contain 1 through
        10 letters, digits, hyphens, or underscores. Defaults to `SG_` when not
        specified in the configuration.
      type: String
      default_value: SG_
      validator: 'LengthBetween(1, 10), stringvalidator.RegexMatches(regexp.MustCompile(`^[A-Za-z0-9_-]+$`), "may contain only letters, digits, hyphens, and underscores")'
      ndfc_nested:
        - management

    - model_name: securityGroupTagMacSegmentation
      tf_name: security_group_tag_mac_segmentation
      description: >-
        Enables MAC-based segmentation for security groups. Defaults to `false`
        when not specified in the configuration.
      type: Bool
      ndfc_type: bool
      default_value: false
      ndfc_nested:
        - management

    - model_name: securityGroupTagIdRange
      tf_name: security_group_tag_id_range
      description: >-
        The security-group tag identifier range. Identifiers must be between 16
        and 65535. Defaults to `10000-14000` when not specified in the configuration.
      type: String
      default_value: '10000-14000'
      ndfc_nested:
        - management
      # The schema defines no range-string pattern. Bounds and ordering require
      # handwritten range validation.

    - model_name: securityGroupTagPreprovision
      tf_name: security_group_tag_preprovision
      description: >-
        Generates security-group configuration for non-enforced VRFs. Defaults to
        `false` when not specified in the configuration.
      type: Bool
      ndfc_type: bool
      default_value: false
      ndfc_nested:
        - management
      # Prior user-confirmed API response default: false. OpenAPI declares true.
      # This observation was not repeated against a live API in this change.

    - model_name: securityGroupStatus
      tf_name: security_group_status
      description: >-
        The security-group status returned by the API. Allowed values are `enabled`,
        `enabledStrict`, `enabledLoose`, `enablePending`, `enablePendingStrict`,
        `enablePendingLoose`, `disablePending`, or `disabled`.
      type: String
      computed: true
      validator: 'OneOf("enabled", "enabledStrict", "enabledLoose", "enablePending", "enablePendingStrict", "enablePendingLoose", "disablePending", "disabled")'
      ndfc_nested:
        - management
      # The API default is disabled, but this read-only value is populated by GET;
      # do not turn it into a configurable Terraform default.

    - model_name: multisiteLoopbackIpRange
      tf_name: multisite_loopback_ip_range
      description: >-
        The IPv4 CIDR range typically used for Loopback100. Defaults to
        `10.10.0.0/24` when not specified in the configuration.
      type: String
      default_value: '10.10.0.0/24'
      validator: 'RegexMatches(regexp.MustCompile(`^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/([0-9]|[12][0-9]|3[0-2])$`), "must be an IPv4 address with a prefix length from 0 through 32")'
      ndfc_nested:
        - management

    - model_name: multisiteUnderlaySubnetRange
      tf_name: multisite_underlay_subnet_range
      description: >-
        The IPv4 CIDR range used for point-to-point DCI links. Defaults to
        `10.10.1.0/24` when not specified in the configuration.
      type: String
      default_value: '10.10.1.0/24'
      validator: 'RegexMatches(regexp.MustCompile(`^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/([0-9]|[12][0-9]|3[0-2])$`), "must be an IPv4 address with a prefix length from 0 through 32")'
      ndfc_nested:
        - management

    - model_name: multisiteUnderlaySubnetTargetMask
      tf_name: multisite_underlay_subnet_target_mask
      description: >-
        The target prefix length for the multi-site underlay subnet range. Valid
        values are 8 through 31. Defaults to `30` when not specified in the configuration.
      type: Int64
      default_value: 30
      validator: 'Between(8, 31)'
      ndfc_nested:
        - management

    - model_name: scheduledBackup
      tf_name: scheduled_backup
      description: >-
        Enables daily configuration backup. When enabled, configure
        `scheduled_backup_time` as well.
      type: Bool
      ndfc_type: bool
      optional: true
      ndfc_nested:
        - management
      # No default is declared in the selected API model.
      # Cross-field rule needs handwritten validation: true requires
      # scheduledBackupTime; scheduledBackupTime must be unset when this is false.

    - model_name: scheduledBackupTime
      tf_name: scheduled_backup_time
      description: >-
        The UTC time for daily configuration backup, from `00:00` through `23:59`
        in 24-hour `HH:MM` format. Configure only when `scheduled_backup` is true.
      type: String
      optional: true
      validator: 'RegexMatches(regexp.MustCompile(`^([01]\d|2[0-3]):([0-5]\d)$`), "must be a UTC time in 24-hour HH:MM format")'
      ndfc_nested:
        - management
